name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant_test
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # The tests take frames out of a video and keep a clone of a repository.
      # Packages come from the Yandex mirror.
      - run: |
          # The runner image takes its mirrors from this list: it is replaced as a whole.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://mirror.yandex.ru/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i -E 's#https?://[a-z.]*(archive|security)\.ubuntu\.com/ubuntu/?#http://mirror.yandex.ru/ubuntu/#g' "$f"
            fi
          done
          grep -rh "^URIs\|^deb " /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u
          grep -rqs mirror.yandex.ru /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg git
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The evaluation cases are read and checked; the model is not called.
      - run: uv run python ../evals/run.py --check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t assistant:ci -f server/docker/Dockerfile server
      # Without its settings the service refuses to start and names what is missing.
      - run: |
          out=$(docker run --rm assistant:ci 2>&1) && exit 1
          echo "$out" | grep -q "Invalid installation settings: TELEGRAM_BOT_TOKEN"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/naive-support-agent -f deploy/helm/naive-support-agent/ci/example-values.yaml
      - run: helm template assistant deploy/helm/naive-support-agent -f deploy/helm/naive-support-agent/ci/example-values.yaml > /dev/null

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx -y @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
