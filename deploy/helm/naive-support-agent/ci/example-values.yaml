# A complete set of values: used by `helm lint` and `helm template` in CI, and as a starting point.
imagePullSecrets:
  - name: ghcr-pull

settings:
  telegram:
    botUsername: support_example_bot
    egress: proxy
    groups: [-1001234567890]
  locale: en
  oidc:
    issuer: https://idp.example.com/realms/main
    clientId: support-assistant
    rolesClaim: resource_access.support-assistant.roles
  roles:
    support: support
    owner: owner
    escalation: escalation
    analytics: admin
    analyticsClaim: resource_access.admin-panel.roles
  model:
    name: claude-opus-5-5
    effort: high
    caseTokenBudget: 400000
    egress: proxy
  followUpIntervalMinutes: 60
  caseRetentionDays: 30
  database:
    host: postgres.example.com
    port: 5432
    name: assistant
    user: assistant

instructions:
  configMap: assistant-instructions

sources:
  existingSecret: assistant-sources

# The database source: postgres-mcp speaks SSE, the assistant reaches it at localhost:8000/sse.
extraContainers:
  - name: database
    image: mirror.gcr.io/crystaldba/postgres-mcp:0.3.0
    args: ["--access-mode=restricted", "--transport=sse", "--sse-host=127.0.0.1", "--sse-port=8000"]
    env:
      - name: DATABASE_URI
        valueFrom:
          secretKeyRef:
            name: assistant-database-source
            key: DATABASE_URI

secrets:
  existingSecret: assistant-secrets

migrations:
  podAnnotations:
    sidecar.istio.io/inject: "false"
