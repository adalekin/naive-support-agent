apiVersion: batch/v1
kind: Job
metadata:
  # A Job cannot be changed in place, so every release revision gets its own.
  name: {{ include "assistant.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "assistant.selectorLabels" (dict "root" . "component" "migrations") | nindent 8 }}
        {{- with .Values.migrations.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.migrations.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      {{- include "assistant.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "assistant.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "assistant.env" . | nindent 12 }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
