{{- if not .Values.secrets.existingSecret }}
{{- $values := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "assistant.fullname" . }}
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: {{ required "secrets.values.telegramBotToken is required when secrets.existingSecret is not set" $values.telegramBotToken | quote }}
  OIDC_CLIENT_SECRET: {{ required "secrets.values.oidcClientSecret is required when secrets.existingSecret is not set" $values.oidcClientSecret | quote }}
  ANTHROPIC_API_KEY: {{ required "secrets.values.anthropicApiKey is required when secrets.existingSecret is not set" $values.anthropicApiKey | quote }}
  ENCRYPTION_KEY: {{ required "secrets.values.encryptionKey is required when secrets.existingSecret is not set" $values.encryptionKey | quote }}
  DB_PASSWORD: {{ required "secrets.values.dbPassword is required when secrets.existingSecret is not set" $values.dbPassword | quote }}
  {{- if eq .Values.settings.telegram.egress "proxy" }}
  TELEGRAM_PROXY_URL: {{ required "secrets.values.telegramProxyUrl is required with settings.telegram.egress: proxy" $values.telegramProxyUrl | quote }}
  {{- end }}
{{- end }}
